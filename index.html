<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGI Mobile Pro - All-in-One</title>
    
    <!-- Librerías de diseño -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --accent: #58a6ff;
            --border: #30363d;
            --header-h: 60px;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
        }

        /* --- PANTALLA DE LOGIN --- */
        #login-screen {
            position: fixed; inset: 0; background: var(--bg-dark);
            z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-box {
            background: var(--bg-card); padding: 30px; border-radius: 20px;
            width: 100%; max-width: 380px; border: 1px solid var(--border); text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        /* --- HEADER SIEMPRE VISIBLE --- */
        header {
            height: var(--header-h); background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 10px; position: fixed; top: 0; width: 100%; z-index: 1000;
        }

        .nav-main { display: flex; gap: 5px; flex: 1; }

        .btn-header {
            background: transparent; border: none; color: #8b949e;
            display: flex; flex-direction: column; align-items: center;
            font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
            min-width: 60px; transition: 0.2s; padding: 5px 0;
        }
        .btn-header i { font-size: 1.4rem; }
        .btn-header.active { color: var(--accent); }

        /* --- MENU DESPLEGABLE FAVORITOS --- */
        #fav-dropdown {
            display: none; position: absolute; top: var(--header-h); left: 50%;
            transform: translateX(-50%); background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 0 0 15px 15px;
            width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 2000;
        }
        .fav-option {
            padding: 15px; border-bottom: 1px solid var(--border);
            font-size: 0.9rem; display: flex; align-items: center; gap: 12px; cursor: pointer;
        }
        .fav-option:last-child { border: none; }
        .fav-option:active { background: #21262d; }

        /* --- FRAME CONTENEDOR --- */
        #main-frame {
            margin-top: var(--header-h); width: 100%;
            height: calc(100vh - var(--header-h)); border: none; background: #f0f2f5;
        }
    </style>
</head>
<body>

    <!-- CAPA LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <i class="bi bi-person-badge text-info" style="font-size: 3.5rem;"></i>
            <h4 class="my-3 fw-bold">SISTEMA INTEGRADO</h4>
            <div class="mb-2">
                <input type="text" id="user-input" class="form-control bg-dark text-white border-secondary" placeholder="Usuario">
            </div>
            <div class="mb-4">
                <input type="password" id="pass-input" class="form-control bg-dark text-white border-secondary" placeholder="Contraseña">
            </div>
            <button onclick="handleLogin()" class="btn btn-info w-100 fw-bold py-2">ACCEDER</button>
            <div id="login-msg" class="text-danger mt-3 small" style="display:none;">Error de credenciales</div>
        </div>
    </div>

    <!-- HEADER ESTRUCTURA -->
    <header id="main-nav" style="display:none;">
        <div class="nav-main">
            <button class="btn-header" onclick="viewInicio()" id="nav-home">
                <i class="bi bi-house-door-fill"></i><span>Inicio</span>
            </button>
            <button class="btn-header" onclick="toggleFavDropdown()" id="nav-fav">
                <i class="bi bi-star-fill"></i><span>Favoritos</span>
            </button>
            <button class="btn-header" onclick="viewAjustes()" id="nav-settings">
                <i class="bi bi-tools"></i><span>Ajustes</span>
            </button>
        </div>
        <button class="btn-header text-danger" onclick="doLogout()">
            <i class="bi bi-power"></i><span>Salir</span>
        </button>

        <!-- DROPDOWN FAVORITOS -->
        <div id="fav-dropdown">
            <div class="fav-option" onclick="listFavorites()"><i class="bi bi-bookmarks-fill"></i> Mis Favoritos</div>
            <div class="fav-option" onclick="addCurrentFav()"><i class="bi bi-bookmark-plus"></i> Agregar este sitio</div>
            <div class="fav-option text-danger" onclick="removeCurrentFav()"><i class="bi bi-bookmark-dash"></i> Borrar de favoritos</div>
        </div>
    </header>

    <!-- EL MARCO DE NAVEGACIÓN -->
    <iframe id="main-frame" name="main-frame" style="display:none;"></iframe>

    <script>
        let dataStore = null;
        let activeUser = null;

        // INICIALIZACIÓN
        async function boot() {
            const saved = localStorage.getItem('sgi_data');
            if (saved) {
                dataStore = JSON.parse(saved);
            } else {
                try {
                    const response = await fetch('system.json');
                    dataStore = await response.json();
                    saveState();
                } catch(e) { alert("Error cargando system.json"); }
            }
            checkSession();
        }

        function saveState() { localStorage.setItem('sgi_data', JSON.stringify(dataStore)); }

        function checkSession() {
            const session = localStorage.getItem('sgi_session');
            if (session && dataStore.users[session]) {
                loginSuccess(session);
            }
        }

        // AUTENTICACIÓN
        function handleLogin() {
            const u = document.getElementById('user-input').value.trim();
            const p = document.getElementById('pass-input').value;
            if (dataStore.users[u] && dataStore.users[u].password === p) {
                localStorage.setItem('sgi_session', u);
                loginSuccess(u);
            } else {
                document.getElementById('login-msg').style.display = 'block';
            }
        }

        function loginSuccess(user) {
            activeUser = user;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-nav').style.display = 'flex';
            document.getElementById('main-frame').style.display = 'block';
            viewInicio();
        }

        // --- VISTA INICIO (GRUPOS Y APPS) ---
        function viewInicio() {
            setTab('nav-home');
            const uInfo = dataStore.users[activeUser];
            
            let html = `
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
                <style>
                    body { background: #f0f2f5; padding: 15px; font-family: sans-serif; }
                    .group-title { color: #555; font-weight: 800; text-transform: uppercase; font-size: 0.8rem; margin: 20px 0 10px 5px; display: flex; justify-content: space-between; }
                    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
                    .app-card { background: white; border-radius: 12px; padding: 15px; text-decoration: none; color: #333; position: relative; border: 1px solid #ddd; display: block; }
                    .app-card:active { transform: scale(0.95); background: #eee; }
                    .app-icon { font-size: 2rem; color: #58a6ff; margin-bottom: 5px; }
                    .app-label { font-weight: bold; font-size: 0.9rem; display: block; }
                    .app-desc { font-size: 0.7rem; color: #777; line-height: 1.1; margin-top: 4px; }
                    .lock-icon { position: absolute; top: 8px; right: 8px; color: #2ea043; font-size: 0.8rem; }
                    .edit-icon { position: absolute; bottom: 8px; right: 8px; color: #aaa; font-size: 0.9rem; }
                    .qa-bar { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
                    .qa-btn { background: #58a6ff; color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; white-space: nowrap; text-decoration: none; font-weight: bold; }
                </style>
                <div class="container-fluid">
                    ${uInfo.quick_access.length > 0 ? `
                        <div class="group-title">Accesos Rápidos</div>
                        <div class="qa-bar">
                            ${uInfo.quick_access.map(q => `<a href="${q.url}" class="qa-btn"><i class="bi ${q.icon}"></i> ${q.label}</a>`).join('')}
                        </div>
                    ` : ''}

                    ${dataStore.content.grupos.map(g => `
                        <div class="group-title">
                            <span>${g.nombre}</span>
                            <i class="bi bi-pencil-square" style="cursor:pointer"></i>
                        </div>
                        <div class="app-grid">
                            ${g.apps.map(a => `
                                <a href="${a.url}" class="app-card">
                                    ${a.has_code ? '<i class="bi bi-lock-fill lock-icon"></i>' : ''}
                                    <i class="bi bi-app-indicator app-icon"></i>
                                    <span class="app-label">${a.label}</span>
                                    <span class="app-desc">${a.desc}</span>
                                    <i class="bi bi-pencil edit-icon"></i>
                                </a>
                            `).join('')}
                        </div>
                    `).join('')}
                </div>
            `;
            renderFrame(html);
        }

        // --- VISTA AJUSTES ---
        function viewAjustes() {
            setTab('nav-settings');
            const u = dataStore.users[activeUser];
            let html = `
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
                <style>body { background: #f8f9fa; padding: 20px; font-family: sans-serif; }</style>
                <div class="container" style="max-width: 500px;">
                    <div class="card shadow-sm p-4 mb-4">
                        <h5 class="fw-bold"><i class="bi bi-person-gear"></i> Perfil</h5>
                        <hr>
                        <div class="mb-3">
                            <label class="small fw-bold">Correo:</label>
                            <input id="set-email" class="form-control" value="${u.email}">
                        </div>
                        <div class="mb-2">
                            <label class="small fw-bold">Confirmar Pass Actual:</label>
                            <input type="password" id="set-old-pass" class="form-control">
                        </div>
                        <div class="mb-2">
                            <label class="small fw-bold">Nueva Contraseña:</label>
                            <input type="password" id="set-new-pass1" class="form-control">
                        </div>
                        <div class="mb-3">
                            <input type="password" id="set-new-pass2" class="form-control" placeholder="Repetir nueva">
                        </div>
                        <button onclick="parent.saveProfileChanges()" class="btn btn-primary w-100 fw-bold">Guardar Cambios</button>
                    </div>

                    <div class="card shadow-sm p-4 mb-4">
                        <h5 class="fw-bold"><i class="bi bi-plus-circle"></i> Configurar Botones</h5>
                        <div class="mb-2">
                            <input id="qa-label" class="form-control" placeholder="Nombre Botón">
                        </div>
                        <div class="mb-2">
                            <input id="qa-icon" class="form-control" placeholder="Icono (ej: bi-link)">
                        </div>
                        <div class="mb-3">
                            <input id="qa-url" class="form-control" placeholder="URL Destino">
                        </div>
                        <button onclick="parent.addQuickAccess()" class="btn btn-outline-primary w-100 fw-bold">Agregar Acceso Rápido</button>
                    </div>
            `;

            if (u.role === 'admin') {
                html += `
                    <div class="card shadow-sm p-4 border-danger mb-4">
                        <h5 class="fw-bold text-danger"><i class="bi bi-shield-lock"></i> Gestión Usuarios</h5>
                        <hr>
                        <div class="mb-2"><input id="adm-u" class="form-control" placeholder="Usuario"></div>
                        <div class="mb-2"><input id="adm-p" class="form-control" placeholder="Password"></div>
                        <div class="mb-3">
                            <select id="adm-r" class="form-select">
                                <option value="user">Usuario</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                        <button onclick="parent.adminCreateUser()" class="btn btn-danger w-100 fw-bold">Registrar Usuario</button>
                    </div>
                `;
            }
            html += `</div>`;
            renderFrame(html);
        }

        // --- FUNCIONES DE LÓGICA DE DATOS ---
        window.saveProfileChanges = function() {
            const f = document.getElementById('main-frame').contentDocument;
            const op = f.getElementById('set-old-pass').value;
            const np1 = f.getElementById('set-new-pass1').value;
            const np2 = f.getElementById('set-new-pass2').value;

            if (op !== dataStore.users[activeUser].password) return alert("Contraseña actual incorrecta");
            
            dataStore.users[activeUser].email = f.getElementById('set-email').value;
            if (np1 && np1 === np2) dataStore.users[activeUser].password = np1;
            
            saveState(); alert("Perfil actualizado"); viewAjustes();
        };

        window.addQuickAccess = function() {
            const f = document.getElementById('main-frame').contentDocument;
            const label = f.getElementById('qa-label').value;
            const url = f.getElementById('qa-url').value;
            if(!label || !url) return alert("Completa nombre y url");

            dataStore.users[activeUser].quick_access.push({
                label: label,
                icon: f.getElementById('qa-icon').value || 'bi-link',
                url: url
            });
            saveState(); viewInicio();
        };

        window.adminCreateUser = function() {
            const f = document.getElementById('main-frame').contentDocument;
            const u = f.getElementById('adm-u').value.trim();
            const p = f.getElementById('adm-p').value;
            if (!u || !p) return;

            dataStore.users[u] = {
                password: p, role: f.getElementById('adm-r').value,
                email: "", favorites: [], quick_access: []
            };
            saveState(); alert("Usuario registrado con éxito"); viewAjustes();
        };

        // --- FAVORITOS ---
        function toggleFavDropdown() {
            const d = document.getElementById('fav-dropdown');
            d.style.display = d.style.display === 'block' ? 'none' : 'block';
        }

        function addCurrentFav() {
            const url = document.getElementById('main-frame').contentWindow.location.href;
            if (url.includes('about:srcdoc')) return alert("No se puede agregar una página de sistema");
            const title = prompt("Título del favorito:");
            if (title) {
                dataStore.users[activeUser].favorites.push({label: title, url: url});
                saveState(); alert("Agregado!");
            }
            toggleFavDropdown();
        }

        function listFavorites() {
            setTab('nav-fav');
            const favs = dataStore.users[activeUser].favorites;
            let html = `
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
                <style>body { background: #f0f2f5; padding: 20px; font-family: sans-serif; }</style>
                <div class="container">
                    <h5 class="fw-bold">Mis Favoritos</h5>
                    <div class="list-group">
                        ${favs.length ? favs.map((f, i) => `
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <a href="${f.url}" style="text-decoration:none; color:#333;">${f.label}</a>
                                <button onclick="parent.deleteFav(${i})" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </div>
                        `).join('') : '<p class="text-muted">No tienes favoritos aún.</p>'}
                    </div>
                </div>
            `;
            renderFrame(html);
            toggleFavDropdown();
        }

        window.deleteFav = function(index) {
            dataStore.users[activeUser].favorites.splice(index, 1);
            saveState(); listFavorites();
        };

        // --- UTILIDADES ---
        function renderFrame(html) {
            const frame = document.getElementById('main-frame');
            frame.srcdoc = html;
        }

        function setTab(id) {
            document.querySelectorAll('.btn-header').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('fav-dropdown').style.display = 'none';
        }

        function doLogout() {
            localStorage.removeItem('sgi_session');
            location.reload();
        }

        window.onload = boot;
    </script>
</body>
</html>
