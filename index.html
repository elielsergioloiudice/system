<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGI Mobile Pro - Enterprise Edition</title>
    
    <!-- Frameworks y Estilos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --accent: #58a6ff;
            --border: #30363d;
            --header-h: 65px;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        /* --- SECCIÓN LOGIN --- */
        #login-screen {
            position: fixed; inset: 0; background: var(--bg-dark);
            z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-box {
            background: var(--bg-card); padding: 35px 25px; border-radius: 24px;
            width: 100%; max-width: 400px; border: 1px solid var(--border);
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .form-control-custom {
            background: #0d1117 !important; border: 1px solid var(--border) !important;
            color: #fff !important; padding: 12px;
        }

        /* --- HEADER SIEMPRE VISIBLE --- */
        header {
            height: var(--header-h); background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 10px; position: fixed; top: 0; width: 100%; z-index: 1000;
        }
        .nav-main { display: flex; gap: 5px; flex: 1; }
        .btn-header {
            background: transparent; border: none; color: #8b949e;
            display: flex; flex-direction: column; align-items: center;
            font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
            min-width: 65px; transition: 0.2s;
        }
        .btn-header i { font-size: 1.5rem; }
        .btn-header.active { color: var(--accent); }

        /* --- FAVORITOS DROPDOWN --- */
        #fav-dropdown {
            display: none; position: absolute; top: var(--header-h); left: 50%;
            transform: translateX(-50%); background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 0 0 20px 20px;
            width: 280px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 2000;
        }
        .fav-option {
            padding: 15px; border-bottom: 1px solid var(--border);
            font-size: 0.9rem; display: flex; align-items: center; gap: 12px; cursor: pointer;
        }
        .fav-option:last-child { border: none; }

        /* --- VIEWPORT --- */
        #main-frame {
            margin-top: var(--header-h); width: 100%;
            height: calc(100vh - var(--header-h)); border: none; background: #f0f2f5;
        }

        /* Toggle Switch Custom */
        .form-switch .form-check-input { width: 2.5em; height: 1.25em; cursor: pointer; }
    </style>
</head>
<body>

    <!-- PANTALLA DE ACCESO -->
    <div id="login-screen">
        <div class="login-box">
            <i class="bi bi-shield-lock-fill text-info" style="font-size: 3.5rem;"></i>
            <h4 class="mt-3 mb-4 fw-bold">ACCESO AL SISTEMA</h4>
            
            <div class="mb-3">
                <input type="text" id="user-input" class="form-control form-control-custom" placeholder="Usuario">
            </div>
            
            <div class="input-group mb-3">
                <input type="password" id="pass-input" class="form-control form-control-custom" placeholder="Contraseña">
                <button class="btn btn-outline-secondary border-secondary" type="button" id="toggle-password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <div class="form-check form-switch d-flex justify-content-center align-items-center gap-3 mb-4">
                <input class="form-check-input" type="checkbox" id="remember-me">
                <label class="form-check-label small text-secondary" for="remember-me">Recordar mis datos</label>
            </div>

            <button onclick="handleLogin()" class="btn btn-info w-100 fw-bold py-2 shadow-sm">ENTRAR</button>
            <div id="login-msg" class="text-danger mt-3 small fw-bold" style="display:none;">CREDENCIALES INCORRECTAS</div>
        </div>
    </div>

    <!-- NAVEGACIÓN SUPERIOR -->
    <header id="main-nav" style="display:none;">
        <div class="nav-main">
            <button class="btn-header" onclick="viewInicio()" id="nav-home">
                <i class="bi bi-house-door-fill"></i><span>Inicio</span>
            </button>
            <button class="btn-header" onclick="toggleFavDropdown()" id="nav-fav">
                <i class="bi bi-star-fill"></i><span>Favoritos</span>
            </button>
            <button class="btn-header" onclick="viewAjustes()" id="nav-settings">
                <i class="bi bi-tools"></i><span>Ajustes</span>
            </button>
        </div>
        <button class="btn-header text-danger" onclick="doLogout()">
            <i class="bi bi-power"></i><span>Salir</span>
        </button>

        <div id="fav-dropdown">
            <div class="fav-option" onclick="listFavorites()"><i class="bi bi-collection-play"></i> Mis Favoritos</div>
            <div class="fav-option" onclick="addCurrentFav()"><i class="bi bi-plus-square"></i> Agregar Actual</div>
            <div class="fav-option text-danger" onclick="removeCurrentFav()"><i class="bi bi-trash"></i> Borrar Actual</div>
        </div>
    </header>

    <!-- CONTENEDOR DE CONTENIDO -->
    <iframe id="main-frame" name="main-frame" style="display:none;"></iframe>

    <script>
        let dataStore = null;
        let activeUser = null;

        // --- ARRANQUE Y PERSISTENCIA SERVIDOR ---
        async function boot() {
            try {
                // Cargar datos desde system.php[cite: 1]
                const response = await fetch('system.php');
                dataStore = await response.json();
                
                // Cargar datos recordados si existen
                loadRemembered();
                
                // Verificar sesión activa en esta pestaña
                const session = sessionStorage.getItem('sgi_session');
                if (session && dataStore.users[session]) loginSuccess(session);
            } catch(e) { alert("Error de comunicación con el servidor."); }
        }

        async function sync() {
            try {
                await fetch('system.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataStore)
                });
            } catch(e) { console.error("Error al sincronizar datos."); }
        }

        // --- LÓGICA DE LOGIN ---
        function handleLogin() {
            const u = document.getElementById('user-input').value.trim();
            const p = document.getElementById('pass-input').value;
            const remember = document.getElementById('remember-me').checked;

            if (dataStore.users[u] && dataStore.users[u].password === p) {
                // Manejo de "Recordar datos"
                if (remember) {
                    localStorage.setItem('sgi_remember_u', u);
                    localStorage.setItem('sgi_remember_p', p);
                    localStorage.setItem('sgi_remember_check', true);
                } else {
                    localStorage.removeItem('sgi_remember_u');
                    localStorage.removeItem('sgi_remember_p');
                    localStorage.removeItem('sgi_remember_check');
                }

                sessionStorage.setItem('sgi_session', u);
                loginSuccess(u);
            } else {
                document.getElementById('login-msg').style.display = 'block';
                setTimeout(() => document.getElementById('login-msg').style.display = 'none', 3000);
            }
        }

        function loadRemembered() {
            const u = localStorage.getItem('sgi_remember_u');
            const p = localStorage.getItem('sgi_remember_p');
            const c = localStorage.getItem('sgi_remember_check');
            if (c) {
                document.getElementById('user-input').value = u || "";
                document.getElementById('pass-input').value = p || "";
                document.getElementById('remember-me').checked = true;
            }
        }

        function loginSuccess(user) {
            activeUser = user;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-nav').style.display = 'flex';
            document.getElementById('main-frame').style.display = 'block';
            viewInicio();
        }

        // --- INTERFAZ DINÁMICA ---
        function viewInicio() {
            setTab('nav-home');
            const u = dataStore.users[activeUser];
            let html = `
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
                <style>
                    body { background: #f0f2f5; padding: 15px; font-family: sans-serif; }
                    .section-title { color: #666; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; margin: 20px 0 10px 5px; display: flex; justify-content: space-between; }
                    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
                    .app-card { background: #fff; border-radius: 15px; padding: 18px; text-decoration: none; color: #333; position: relative; border: 1px solid #ddd; display: block; transition: 0.2s; }
                    .app-card:active { transform: scale(0.95); }
                    .app-icon { font-size: 2rem; color: #58a6ff; margin-bottom: 5px; }
                    .app-label { font-weight: bold; font-size: 0.9rem; display: block; }
                    .app-desc { font-size: 0.7rem; color: #777; margin-top: 5px; line-height: 1.2; }
                    .lock-icon { position: absolute; top: 10px; right: 10px; color: #2ea043; }
                    .pencil-icon { position: absolute; bottom: 10px; right: 10px; color: #adb5bd; }
                    .qa-strip { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 15px; scrollbar-width: none; }
                    .qa-btn { background: #58a6ff; color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 0.8rem; font-weight: bold; white-space: nowrap; }
                </style>
                <div class="container-fluid">
                    ${u.quick_access.length ? `
                        <div class="section-title">Acceso Directo</div>
                        <div class="qa-strip">${u.quick_access.map(q => `<a href="${q.url}" class="qa-btn"><i class="bi ${q.icon}"></i> ${q.label}</a>`).join('')}</div>
                    ` : ''}
                    ${dataStore.content.grupos.map(g => `
                        <div class="section-title"><span>${g.nombre}</span> <i class="bi bi-pencil"></i></div>
                        <div class="app-grid">
                            ${g.apps.map(a => `
                                <a href="${a.url}" class="app-card">
                                    ${a.has_code ? '<i class="bi bi-lock-fill lock-icon"></i>' : ''}
                                    <i class="bi bi-app-indicator app-icon"></i>
                                    <span class="app-label">${a.label}</span>
                                    <span class="app-desc">${a.desc}</span>
                                    <i class="bi bi-pencil pencil-icon"></i>
                                </a>
                            `).join('')}
                        </div>
                    `).join('')}
                </div>
            `;
            renderFrame(html);
        }

        function viewAjustes() {
            setTab('nav-settings');
            const u = dataStore.users[activeUser];
            let html = `
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
                <style>body { background: #f8f9fa; padding: 20px; font-family: sans-serif; }</style>
                <div class="container" style="max-width: 450px;">
                    <div class="card p-4 shadow-sm mb-4">
                        <h6 class="fw-bold mb-3"><i class="bi bi-person-gear"></i> MI PERFIL</h6>
                        <label class="small fw-bold">Correo Electrónico:</label>
                        <input id="set-email" class="form-control mb-3" value="${u.email}">
                        <label class="small fw-bold">Validar Pass Actual:</label>
                        <input type="password" id="set-old-pass" class="form-control mb-2">
                        <hr>
                        <label class="small fw-bold">Nueva Password (Opcional):</label>
                        <input type="password" id="set-new-pass1" class="form-control mb-2" placeholder="Nueva clave">
                        <input type="password" id="set-new-pass2" class="form-control mb-4" placeholder="Repetir nueva clave">
                        <button onclick="parent.saveProfile()" class="btn btn-primary w-100 fw-bold">GUARDAR CAMBIOS</button>
                    </div>

                    <div class="card p-4 shadow-sm mb-4">
                        <h6 class="fw-bold mb-3"><i class="bi bi-plus-circle"></i> NUEVO BOTÓN INICIO</h6>
                        <input id="qa-l" class="form-control mb-2" placeholder="Nombre Botón">
                        <input id="qa-i" class="form-control mb-2" placeholder="Icono (ej: bi-link)">
                        <input id="qa-u" class="form-control mb-4" placeholder="URL Destino">
                        <button onclick="parent.addQA()" class="btn btn-outline-primary w-100 fw-bold">AGREGAR ACCESO</button>
                    </div>
            `;
            if (u.role === 'admin') {
                html += `
                    <div class="card p-4 shadow-sm border-danger">
                        <h6 class="fw-bold text-danger mb-3"><i class="bi bi-people-fill"></i> GESTIÓN USUARIOS (ADMIN)</h6>
                        <input id="adm-u" class="form-control mb-2" placeholder="Nuevo Usuario">
                        <input id="adm-p" class="form-control mb-3" placeholder="Contraseña">
                        <select id="adm-r" class="form-select mb-4">
                            <option value="user">Usuario Estándar</option>
                            <option value="admin">Administrador</option>
                        </select>
                        <button onclick="parent.adminCreate()" class="btn btn-danger w-100 fw-bold">REGISTRAR NUEVO</button>
                    </div>
                `;
            }
            html += `</div>`;
            renderFrame(html);
        }

        // --- FUNCIONES SERVIDOR (Llamadas desde frame) ---
        window.saveProfile = async function() {
            const f = document.getElementById('main-frame').contentDocument;
            const op = f.getElementById('set-old-pass').value;
            if (op !== dataStore.users[activeUser].password) return alert("Contraseña actual incorrecta");
            
            dataStore.users[activeUser].email = f.getElementById('set-email').value;
            const np1 = f.getElementById('set-new-pass1').value;
            const np2 = f.getElementById('set-new-pass2').value;

            if (np1 && np1 === np2) dataStore.users[activeUser].password = np1;
            else if (np1 !== np2) return alert("Las nuevas contraseñas no coinciden");

            await sync(); alert("Datos actualizados correctamente."); viewAjustes();
        };

        window.addQA = async function() {
            const f = document.getElementById('main-frame').contentDocument;
            const label = f.getElementById('qa-l').value;
            const url = f.getElementById('qa-u').value;
            if(!label || !url) return alert("Nombre y URL son obligatorios.");

            dataStore.users[activeUser].quick_access.push({
                label: label,
                icon: f.getElementById('qa-i').value || 'bi-link',
                url: url
            });
            await sync(); viewInicio();
        };

        window.adminCreate = async function() {
            const f = document.getElementById('main-frame').contentDocument;
            const user = f.getElementById('adm-u').value.trim();
            const pass = f.getElementById('adm-p').value;
            if (!user || !pass) return alert("Faltan datos");

            dataStore.users[user] = {
                password: pass, role: f.getElementById('adm-r').value,
                email: "", favorites: [], quick_access: []
            };
            await sync(); alert("Usuario creado!"); viewAjustes();
        };

        // --- UTILIDADES ---
        const passToggle = document.getElementById('toggle-password');
        passToggle.addEventListener('click', () => {
            const passField = document.getElementById('pass-input');
            const icon = passToggle.querySelector('i');
            if (passField.type === 'password') {
                passField.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                passField.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });

        function toggleFavDropdown() {
            const d = document.getElementById('fav-dropdown');
            d.style.display = d.style.display === 'block' ? 'none' : 'block';
        }

        function listFavorites() {
            setTab('nav-fav');
            const favs = dataStore.users[activeUser].favorites;
            let html = `
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
                <style>body { background: #f0f2f5; padding: 20px; font-family: sans-serif; }</style>
                <div class="container"><h5 class="fw-bold mb-4">Mis Favoritos</h5>
                <div class="list-group">
                    ${favs.length ? favs.map((f, i) => `
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <a href="${f.url}" style="text-decoration:none; color:#333; font-weight:bold;">${f.label}</a>
                            <button onclick="parent.delFav(${i})" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                        </div>`).join('') : '<p class="text-muted">No tienes sitios favoritos.</p>'}
                </div></div>
            `;
            renderFrame(html); toggleFavDropdown();
        }

        window.delFav = async function(i) {
            dataStore.users[activeUser].favorites.splice(i, 1);
            await sync(); listFavorites();
        };

        function renderFrame(html) { document.getElementById('main-frame').srcdoc = html; }
        function setTab(id) {
            document.querySelectorAll('.btn-header').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('fav-dropdown').style.display = 'none';
        }
        function doLogout() { sessionStorage.clear(); location.reload(); }

        window.onload = boot;
    </script>
</body>
</html>
