<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGI Mobile Pro</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-header: #161b22;
            --accent: #58a6ff;
            --border: #30363d;
            --header-h: 65px;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-main);
            color: #fff;
            overflow: hidden;
            font-family: -apple-system, sans-serif;
        }

        /* --- LOGIN --- */
        #login-overlay {
            position: fixed; inset: 0; background: var(--bg-main);
            z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: var(--bg-header); padding: 30px; border-radius: 20px;
            width: 100%; max-width: 350px; border: 1px solid var(--border); text-align: center;
        }

        /* --- HEADER COMPACTO --- */
        header {
            height: var(--header-h); background: var(--bg-header);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 5px; position: fixed; top: 0; width: 100%; z-index: 1000;
        }

        .nav-group { display: flex; flex: 1; justify-content: flex-start; gap: 2px; }

        .btn-nav {
            background: transparent; border: none; color: #8b949e;
            display: flex; flex-direction: column; align-items: center;
            font-size: 0.6rem; font-weight: bold; text-transform: uppercase;
            min-width: 65px; transition: 0.2s; padding: 5px 0;
        }
        .btn-nav i { font-size: 1.4rem; }
        .btn-nav.active { color: var(--accent); }

        /* --- DROPDOWN FAVORITOS --- */
        #fav-menu {
            display: none; position: absolute; top: var(--header-h); left: 50%;
            transform: translateX(-50%); background: var(--bg-header);
            border: 1px solid var(--border); border-radius: 0 0 15px 15px;
            width: 250px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2000;
        }
        .fav-item {
            padding: 15px; border-bottom: 1px solid var(--border);
            font-size: 0.85rem; display: flex; align-items: center; gap: 10px; cursor: pointer;
        }
        .fav-item:last-child { border: none; }
        .fav-item:active { background: #21262d; }

        /* --- FRAME --- */
        #viewport {
            margin-top: var(--header-h); width: 100%;
            height: calc(100vh - var(--header-h)); border: none; background: #fff;
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <i class="bi bi-shield-lock-fill text-info" style="font-size: 3rem;"></i>
            <h4 class="my-3">SISTEMA GESTIÓN</h4>
            <input type="text" id="user" class="form-control bg-dark text-white border-secondary mb-2" placeholder="Usuario">
            <input type="password" id="pass" class="form-control bg-dark text-white border-secondary mb-3" placeholder="Contraseña">
            <button onclick="validarAuth()" class="btn btn-info w-100 fw-bold">ENTRAR</button>
        </div>
    </div>

    <header id="main-header" style="display:none;">
        <div class="nav-group">
            <button class="btn-nav" onclick="irInicio()" id="btn-home">
                <i class="bi bi-house-door"></i><span>Inicio</span>
            </button>
            <button class="btn-nav" onclick="toggleFavs()" id="btn-fav">
                <i class="bi bi-star"></i><span>Favoritos</span>
            </button>
            <button class="btn-nav" onclick="irAjustes()" id="btn-settings">
                <i class="bi bi-tools"></i><span>Ajustes</span>
            </button>
        </div>
        <button class="btn-nav text-danger" onclick="cerrarSesion()">
            <i class="bi bi-power"></i><span>Salir</span>
        </button>

        <div id="fav-menu">
            <div class="fav-item" onclick="verMisFavoritos()"><i class="bi bi-collection-play"></i> Mis Favoritos</div>
            <div class="fav-item" onclick="agregarAFavoritos()"><i class="bi bi-plus-circle"></i> Agregar este sitio</div>
            <div class="fav-item text-danger" onclick="borrarFavorito()"><i class="bi bi-trash"></i> Borrar de favoritos</div>
        </div>
    </header>

    <iframe id="viewport" name="viewport" style="display:none;"></iframe>

    <script>
        let db = null;
        let session = null;

        // INICIO
        async function loadSystem() {
            const cache = localStorage.getItem('sgi_cache');
            if (cache) {
                db = JSON.parse(cache);
            } else {
                const res = await fetch('system.json');
                db = await res.json();
                actualizarCache();
            }
            checkAutoLogin();
        }

        function actualizarCache() { localStorage.setItem('sgi_cache', JSON.stringify(db)); }

        function checkAutoLogin() {
            const user = localStorage.getItem('sgi_user');
            if (user && db.users[user]) loginSuccess(user);
        }

        // AUTH
        function validarAuth() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value;
            if (db.users[u] && db.users[u].password === p) {
                localStorage.setItem('sgi_user', u);
                loginSuccess(u);
            } else { alert("Credenciales inválidas"); }
        }

        function loginSuccess(u) {
            session = u;
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-header').style.display = 'flex';
            document.getElementById('viewport').style.display = 'block';
            irInicio();
        }

        // NAVEGACIÓN
        function irInicio() {
            setTab('btn-home');
            const u = db.users[session];
            // Generamos Dashboard dinámico
            let html = `
                <style>
                    body { background: #f0f2f5; font-family: sans-serif; padding: 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
                    .card { background: white; border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-decoration: none; color: #333; }
                    .card i { font-size: 2.5rem; color: #58a6ff; display: block; margin-bottom: 10px; }
                    .card span { font-weight: bold; font-size: 0.9rem; }
                </style>
                <h3>Bienvenido, ${session}</h3>
                <div style="grid-column: span 2; height: 1px; background: #ddd; margin: 10px 0;"></div>
            `;
            u.quick_access.forEach(btn => {
                html += `<a href="${btn.url}" class="card"><i class="bi ${btn.icon}"></i><span>${btn.label}</span></a>`;
            });
            document.getElementById('viewport').srcdoc = html;
        }

        function irAjustes() {
            setTab('btn-settings');
            const u = db.users[session];
            let html = `
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
                <style>body { padding: 20px; background: #f8f9fa; }</style>
                <div class="container">
                    <div class="card p-3 shadow-sm mb-4">
                        <h5 class="fw-bold">Mi Perfil</h5>
                        <p class="small text-muted">Rol: ${u.role}</p>
                        <label class="form-label mt-2">Email:</label>
                        <input id="email" class="form-control mb-3" value="${u.email}">
                        <hr>
                        <label class="form-label">Contraseña Actual:</label>
                        <input type="password" id="old_p" class="form-control mb-2">
                        <label class="form-label">Nueva Contraseña:</label>
                        <input type="password" id="new_p1" class="form-control mb-2">
                        <input type="password" id="new_p2" class="form-control mb-3" placeholder="Repetir nueva">
                        <button onclick="parent.saveProfile()" class="btn btn-primary w-100">Guardar Cambios</button>
                    </div>

                    <div class="card p-3 shadow-sm mb-4">
                        <h5 class="fw-bold">Botones Acceso Rápido</h5>
                        <input id="qa_n" class="form-control mb-2" placeholder="Nombre (ej: Google)">
                        <input id="qa_i" class="form-control mb-2" placeholder="Icono (ej: bi-link)">
                        <input id="qa_u" class="form-control mb-2" placeholder="URL">
                        <button onclick="parent.addQA()" class="btn btn-outline-primary w-100">+ Añadir Botón</button>
                    </div>
            `;

            if(u.role === 'admin') {
                html += `
                    <div class="card p-3 shadow-sm border-danger">
                        <h5 class="fw-bold text-danger">Administración Usuarios</h5>
                        <input id="adm_u" class="form-control mb-2" placeholder="Nuevo Usuario">
                        <input id="adm_p" class="form-control mb-2" placeholder="Contraseña">
                        <select id="adm_r" class="form-select mb-3">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                        <button onclick="parent.adminAdd()" class="btn btn-danger w-100">Registrar</button>
                    </div>
                `;
            }

            html += `</div>`;
            document.getElementById('viewport').srcdoc = html;
        }

        // LÓGICA DE ACCIÓN (Llamada desde el frame)
        window.saveProfile = function() {
            const f = document.getElementById('viewport').contentDocument;
            const op = f.getElementById('old_p').value;
            const np1 = f.getElementById('new_p1').value;
            const np2 = f.getElementById('new_p2').value;

            if (op !== db.users[session].password) return alert("Contraseña actual incorrecta");
            
            db.users[session].email = f.getElementById('email').value;
            if (np1 && np1 === np2) db.users[session].password = np1;
            
            actualizarCache(); alert("Actualizado!"); irAjustes();
        };

        window.addQA = function() {
            const f = document.getElementById('viewport').contentDocument;
            const btn = {
                label: f.getElementById('qa_n').value,
                icon: f.getElementById('qa_i').value || 'bi-app',
                url: f.getElementById('qa_u').value
            };
            db.users[session].quick_access.push(btn);
            actualizarCache(); irInicio();
        };

        window.adminAdd = function() {
            const f = document.getElementById('viewport').contentDocument;
            const user = f.getElementById('adm_u').value.trim();
            if (!user) return;
            db.users[user] = {
                password: f.getElementById('adm_p').value,
                role: f.getElementById('adm_r').value,
                email: "", favorites: [], quick_access: []
            };
            actualizarCache(); alert("Usuario Creado"); irAjustes();
        }

        // UTILIDADES
        function setTab(id) {
            document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('fav-menu').style.display = 'none';
        }

        function toggleFavs() {
            const m = document.getElementById('fav-menu');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }

        function cerrarSesion() { localStorage.removeItem('sgi_user'); location.reload(); }

        window.onload = loadSystem;
    </script>
</body>
</html>
