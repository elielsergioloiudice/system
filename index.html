<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel de Gestión Pro</title>
    
    <!-- Frameworks Externos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-card: #161b22;
            --border-ui: #30363d;
            --text-main: #c9d1d9;
            --accent: #58a6ff;
            --header-h: 15vh;
            --frame-h: 85vh;
        }

        /* Reset y Base */
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-main);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* --- CAPA DE ACCESO (LOGIN) --- */
        #pantalla-acceso {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease-in-out;
        }

        .card-login {
            background: var(--bg-card);
            border: 1px solid var(--border-ui);
            padding: 2.5rem;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* --- DASHBOARD ESTRUCTURA --- */
        #main-dashboard {
            display: none; /* Se activa vía JS */
            flex-direction: column;
            width: 100%;
            height: 100vh;
        }

        header {
            height: var(--header-h);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-ui);
            display: flex;
            align-items: center;
            padding: 0 15px;
            width: 100%;
            z-index: 100;
        }

        .nav-scroller {
            display: flex;
            gap: 10px;
            width: 100%;
            overflow-x: auto;
            padding: 5px 0;
            scrollbar-width: none;
        }
        .nav-scroller::-webkit-scrollbar { display: none; }

        /* Botones del Header */
        .btn-app {
            background: #21262d;
            border: 1px solid var(--border-ui);
            color: var(--text-main);
            border-radius: 12px;
            padding: 8px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 85px;
            height: 65px;
            transition: all 0.2s ease;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-app i { font-size: 1.4rem; margin-bottom: 3px; }
        .btn-app span { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }
        
        .btn-app:active, .btn-app.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            transform: scale(0.95);
        }

        .btn-locked {
            border-color: #238636;
            color: #2ea043;
        }

        /* Marco de Visualización */
        #viewport {
            width: 100%;
            height: var(--frame-h);
            background: #f0f2f5;
            border: none;
        }

        /* Área Segura (Selector Generador) */
        .area-segura {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(35, 134, 54, 0.1);
            padding: 5px 10px;
            border-radius: 12px;
            border: 1px solid #238636;
        }

        /* Utilidades */
        .form-control-dark {
            background: #0d1117 !important;
            border: 1px solid var(--border-ui) !important;
            color: #fff !important;
            border-radius: 8px;
        }
        .error-msg {
            color: #ff7b72;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 1. CAPA DE ACCESO -->
    <div id="pantalla-acceso">
        <div class="card-login">
            <div class="mb-4">
                <i class="bi bi-shield-lock-fill text-info" style="font-size: 3rem;"></i>
                <h4 class="fw-bold mt-2">LOGIN</h4>
            </div>

            <div class="mb-3">
                <input type="text" id="user" class="form-control form-control-dark py-2" placeholder="Usuario">
            </div>

            <div class="input-group mb-3">
                <input type="password" id="pass" class="form-control form-control-dark py-2" placeholder="Contraseña">
                <button class="btn btn-outline-secondary border-secondary" type="button" id="togglePass">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <div class="form-check form-switch d-flex justify-content-center gap-2 mb-4">
                <input class="form-check-input" type="checkbox" id="recordar">
                <label class="form-check-label small text-secondary" for="recordar">Mantener sesión iniciada</label>
            </div>

            <button onclick="validarLogin()" class="btn btn-info w-100 fw-bold py-2 shadow">ACCEDER</button>
            <div id="login-error" class="error-msg">Datos incorrectos o error de configuración.</div>
        </div>
    </div>

    <!-- 2. INTERFAZ DASHBOARD -->
    <div id="main-dashboard">
        <header>
            <div class="nav-scroller" id="header-nav">
                <!-- Los botones se cargarán dinámicamente aquí -->
            </div>
            
            <button onclick="logout()" class="btn-app ms-auto" style="border-color: #f85149; color: #f85149; min-width: 60px; margin-left: 10px;">
                <i class="bi bi-power"></i>
                <span>Salir</span>
            </button>
        </header>

        <iframe id="viewport" name="viewport" src="about:blank"></iframe>
    </div>

    <script>
        let systemData = null;
        let currentUserData = null;

        const dom = {
            loginScreen: document.getElementById('pantalla-acceso'),
            dashboard: document.getElementById('main-dashboard'),
            user: document.getElementById('user'),
            pass: document.getElementById('pass'),
            recordar: document.getElementById('recordar'),
            error: document.getElementById('login-error'),
            iframe: document.getElementById('viewport'),
            nav: document.getElementById('header-nav')
        };

        // CARGA INICIAL: Leer JSON
        async function init() {
            try {
                const response = await fetch('system.json');
                if (!response.ok) throw new Error("No se pudo cargar system.json");
                systemData = await response.json();
                
                checkSession();
            } catch (err) {
                console.error(err);
                alert("Error crítico: system.json no encontrado o mal formado.");
            }
        }

        // Persistencia de sesión
        function checkSession() {
            const sessionUser = localStorage.getItem('session_user');
            if (sessionUser && systemData.users[sessionUser]) {
                loginExitoso(sessionUser);
            }
        }

        // Validación de credenciales
        function validarLogin() {
            const u = dom.user.value.trim().toLowerCase();
            const p = dom.pass.value.trim();

            if (systemData.users[u] && systemData.users[u].password === p) {
                if (dom.recordar.checked) {
                    localStorage.setItem('session_user', u);
                }
                loginExitoso(u);
            } else {
                dom.error.style.display = "block";
                setTimeout(() => dom.error.style.display = "none", 3000);
            }
        }

        // Construcción dinámica de la interfaz
        function loginExitoso(username) {
            currentUserData = systemData.users[username];
            
            // Limpiar y construir botones
            dom.nav.innerHTML = '';
            currentUserData.apps.forEach(app => {
                if (app.has_code) {
                    // Botón con candado y selector
                    const wrapper = document.createElement('div');
                    wrapper.className = 'd-flex gap-2';
                    wrapper.innerHTML = `
                        <button id="btn-lock-${app.id}" onclick="unlockApp('${app.id}', '${app.security_code}')" class="btn-app btn-locked">
                            <i class="bi bi-lock-fill"></i>
                            <span>${app.label}</span>
                        </button>
                        <div id="area-${app.id}" class="area-segura">
                            <select id="sel-${app.id}" class="form-select form-select-sm" style="width: 120px; font-size: 10px;">
                                ${systemData.plantillas_disponibles.map(img => `<option value="${img}">${img}</option>`).join('')}
                            </select>
                            <button onclick="abrirAppConPlantilla('${app.id}', '${app.url}')" class="btn btn-success btn-sm">
                                <i class="bi bi-play-fill"></i>
                            </button>
                        </div>
                    `;
                    dom.nav.appendChild(wrapper);
                } else {
                    // Botón simple
                    const btn = document.createElement('div');
                    btn.className = 'btn-app';
                    btn.innerHTML = `<i class="bi ${app.icon}"></i><span>${app.label}</span>`;
                    btn.onclick = (e) => nav(app.url, btn);
                    dom.nav.appendChild(btn);
                }
            });

            // Transición Visual
            dom.loginScreen.style.opacity = "0";
            dom.loginScreen.style.pointerEvents = "none";
            setTimeout(() => {
                dom.loginScreen.style.display = "none";
                dom.dashboard.style.display = "flex";
                
                // Cargar página por defecto del usuario
                nav(currentUserData.default_page, dom.nav.querySelector('.btn-app'));
            }, 500);
        }

        // Navegación
        function nav(url, btn) {
            document.querySelectorAll('.btn-app').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            dom.iframe.src = url;
        }

        // Lógica de desbloqueo
        function unlockApp(id, code) {
            const input = prompt("CÓDIGO DE SEGURIDAD:");
            if (input === code) {
                document.getElementById(`btn-lock-${id}`).style.display = "none";
                document.getElementById(`area-${id}`).style.display = "flex";
            } else if (input !== null) {
                alert("CÓDIGO INCORRECTO");
            }
        }

        function abrirAppConPlantilla(id, urlBase) {
            const img = document.getElementById(`sel-${id}`).value;
            const finalUrl = `${urlBase}?img=${encodeURIComponent(img)}`;
            nav(finalUrl, null);
        }

        function logout() {
            localStorage.removeItem('session_user');
            location.reload();
        }

        // Eventos y utilidades
        const btnEye = document.getElementById('togglePass');
        btnEye.addEventListener('mousedown', () => dom.pass.type = 'text');
        btnEye.addEventListener('mouseup', () => dom.pass.type = 'password');
        btnEye.addEventListener('mouseleave', () => dom.pass.type = 'password');

        [dom.user, dom.pass].forEach(el => {
            el.addEventListener('keypress', (e) => { if(e.key === 'Enter') validarLogin(); });
        });

        // Iniciar
        window.onload = init;
    </script>
</body>
</html>
